<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-label="Ihsan Auliya Habiburrohim, Web dan Mobile Developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1320"/>
      <stop offset="1" stop-color="#0f2a2e"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5b942" stop-opacity=".6"/>
      <stop offset=".35" stop-color="#f5b942" stop-opacity=".9"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity=".9"/>
    </linearGradient>
  </defs>
  <rect width="880" height="250" rx="18" fill="url(#bg)"/>
  <!-- motif gonjong (atap rumah gadang) -->
  <g fill="none" stroke="url(#line)" stroke-width="2.2" stroke-linecap="round" opacity=".7">
    <path d="M610 92 C628 140 645 152 663 152 C681 152 698 140 716 92 C734 140 751 152 769 152 C787 152 804 140 822 92"/>
    <path d="M610 92 l-7 -9 M716 92 l0 -11 M822 92 l7 -9"/>
    <path d="M628 150 V206 M716 150 V206 M804 150 V206" stroke-opacity=".35"/>
    <path d="M600 206 H840" stroke-dasharray="2 7"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">
    <text x="48" y="62" font-size="15" fill="#2dd4bf">// halo, saya</text>
  </g>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="46" y="108" font-size="38" font-weight="700" fill="#f0f6fc">Ihsan Auliya</text>
    <text x="46" y="150" font-size="38" font-weight="700" fill="#f0f6fc">Habiburrohim</text>
    <text x="48" y="184" font-size="16" fill="#9fb0c3">Web &amp; Mobile Developer · Sistem Informasi, Universitas Andalas</text>
  </g>
  <!-- baris terminal dengan kursor berkedip -->
  <g font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="14">
